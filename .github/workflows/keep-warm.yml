name: Keep the demo awake
# Free Hugging Face Spaces go to sleep after 48 hours without visitors. A ping twice a day keeps the link live.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping /health
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_SPACE" ]; then echo "HF_SPACE variable not set; nothing to ping"; exit 0; fi
          host=$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 30 "https://${host}.hf.space/health"
