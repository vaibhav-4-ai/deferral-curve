name: Keep the demo awake
# Render's free plan puts the site to sleep after 15 minutes without visitors. A ping every 10 minutes keeps it live.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping /health
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then echo "DEMO_URL variable not set; nothing to ping"; exit 0; fi
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 30 "${DEMO_URL%/}/health"
