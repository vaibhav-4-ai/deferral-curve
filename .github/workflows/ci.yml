name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: pytest
      - run: python -m dc eval
      - run: python -m dc calibrate
      - name: Experiment - does code-mixing (CMI) help the hand-off decision?
        run: python -m dc cmi-experiment
